[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "internship-finder"
version = "2.0.0"
description = "Merge public internship lists into one shortlist for F-1 students, minus the roles you already applied to."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
internship-finder = "internship_finder.cli:main"

[tool.setuptools]
packages = ["internship_finder"]

[tool.setuptools.package-data]
internship_finder = ["data/*.txt"]
